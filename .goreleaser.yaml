project_name: gwy-query
builds:
  - binary: gwy-query
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
archives:
  - format: tar.gz
    files:
      - config.yaml
release:
  draft: false
  name_template: "{{.ProjectName}}-{{.Version}}"
  github:
    owner: vivimanZhang
    name: gwy-query
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{.ProjectName}}-{{.Version}}-SNAPSHOT"
nfpms:
  - vendor: VIVIB
    homepage: https://www.viviman.top
    maintainer: vivib@foxmail.com
    description: 外置查询应用
    license: MIT
    section: base
    priority: optional
    inputs:
      - ./gwy-query
      - ./config.yaml
    install: /opt/gwy
    overwrite: true
    targets:
      - debian
project_name: gwy-query
builds:
  - binary: gwy-query
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
archives:
  - format: tar.gz
    files:
      - config.yaml
release:
  draft: false
  name_template: "{{.ProjectName}}-{{.Version}}"
  github:
    owner: vivimanZhang
    name: gwy-query
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{.ProjectName}}-{{.Version}}-SNAPSHOT"
nfpms:
  - vendor: VIVIB
    homepage: https://www.viviman.top
    maintainer: vivib@foxmail.com
    description: 外置查询应用
    license: MIT
    section: base
    priority: optional
    files:
      - ./gwy-query=/opt/gwy/
      - ./config.yaml=/opt/gwy/
    overwrite: true
    from_dir: ./dist
    targets:
      - debian